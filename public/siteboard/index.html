<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="기존 Siteboard 작업 파일을 백업하고 새 독립 주소로 이동합니다." />
    <title>Siteboard 주소 이전</title>
    <link rel="stylesheet" href="/data-move.css" />
    <script src="/data-move.js" defer></script>
  </head>
  <body data-product="Siteboard">
    <main>
      <div class="mark" aria-hidden="true">S</div>
      <p class="eyebrow">SITEBOARD / ADDRESS MOVE</p>
      <h1>기존 작업을 챙겨 새 주소로 이동하세요.</h1>
      <p class="lead">
        Siteboard는 독립된 GitHub Pages 주소에서 운영합니다. 이 화면은
        whago.net에 저장된 기존 작업을 현재 브라우저에서 백업할 수 있도록
        남겨 둔 이전 창구입니다.
      </p>

      <section class="panel" aria-labelledby="backup-title">
        <header>
          <h2 id="backup-title">찾은 작업 파일</h2>
          <span id="backup-count" aria-live="polite">확인 중</span>
        </header>
        <div id="backup-list"></div>
      </section>

      <ol class="steps">
        <li><span>01</span>위에서 찾은 작업 파일을 저장합니다.</li>
        <li><span>02</span>새 Siteboard 주소를 엽니다.</li>
        <li><span>03</span>작업 파일 열기에서 저장한 파일을 선택합니다.</li>
      </ol>

      <a class="destination" rel="noreferrer">
        <span>새 Siteboard 열기</span><span aria-hidden="true">↗</span>
      </a>
    </main>
  </body>
</html>
