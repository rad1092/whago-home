server {
    server_name whago.net;

    root /srv/whago-home/current/out;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    location = /healthz {
        default_type text/plain;
        expires -1;
        return 200 "ok\n";
    }

    location = /daymark {
        return 302 /daymark/;
    }

    location = /daymark/ {
        try_files /daymark/index.html =404;
        expires -1;
    }

    location = /daymark/index.html {
        internal;
        try_files $uri =404;
        expires -1;
    }

    location ^~ /daymark/ {
        return 308 https://rad1092.github.io$request_uri;
    }

    location = /repolens {
        return 308 https://rad1092.github.io/repolens/;
    }

    location ^~ /repolens/ {
        return 308 https://rad1092.github.io$request_uri;
    }

    location = /siteboard {
        return 302 /siteboard/;
    }

    location = /siteboard/ {
        try_files /siteboard/index.html =404;
        expires -1;
    }

    location = /siteboard/index.html {
        internal;
        try_files $uri =404;
        expires -1;
    }

    location ^~ /siteboard/ {
        return 308 https://rad1092.github.io$request_uri;
    }

    location ^~ /_next/static/ {
        try_files $uri =404;
        expires 1y;
    }

    location = /index.html {
        try_files $uri =404;
        expires -1;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
        expires -1;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/whago.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whago.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen [::]:443 ssl;
    listen 443 ssl;
    server_name www.whago.net;

    root /srv/whago-home/current/out;

    location = /daymark {
        return 302 /daymark/;
    }

    location = /daymark/ {
        try_files /daymark/index.html =404;
        expires -1;
    }

    location = /daymark/index.html {
        internal;
        try_files $uri =404;
        expires -1;
    }

    location = /siteboard {
        return 302 /siteboard/;
    }

    location = /siteboard/ {
        try_files /siteboard/index.html =404;
        expires -1;
    }

    location = /siteboard/index.html {
        internal;
        try_files $uri =404;
        expires -1;
    }

    location = /data-move.css {
        try_files $uri =404;
        expires -1;
    }

    location = /data-move.js {
        try_files $uri =404;
        expires -1;
    }

    location / {
        return 301 https://whago.net$request_uri;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    ssl_certificate /etc/letsencrypt/live/whago.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whago.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen [::]:443 ssl default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name whago.net;
    return 301 https://whago.net$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.whago.net;

    location = /daymark {
        return 301 https://www.whago.net/daymark/;
    }

    location ^~ /daymark/ {
        return 301 https://www.whago.net$request_uri;
    }

    location = /siteboard {
        return 301 https://www.whago.net/siteboard/;
    }

    location ^~ /siteboard/ {
        return 301 https://www.whago.net$request_uri;
    }

    location / {
        return 301 https://whago.net$request_uri;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
