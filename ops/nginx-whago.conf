server {
    listen [::]:443 ssl default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name whago.net daymark.whago.net repolens.whago.net siteboard.whago.net;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.whago.net;

    location = /daymark {
        return 301 https://www.whago.net/daymark/;
    }

    location ^~ /daymark/ {
        return 301 https://www.whago.net$request_uri;
    }

    location = /siteboard {
        return 301 https://www.whago.net/siteboard/;
    }

    location ^~ /siteboard/ {
        return 301 https://www.whago.net$request_uri;
    }

    location / {
        return 301 https://whago.net$request_uri;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
