server {
    listen [::]:443 ssl;
    listen 443 ssl;
    server_name whago.net;

    root /srv/whago-home/current/out;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    location = /healthz {
        default_type text/plain;
        expires -1;
        return 200 "ok\n";
    }

    # Preserve the two old browser-storage origins long enough for users to
    # download their data before opening the independent product domains.
    location = /daymark {
        return 302 /daymark/;
    }

    location = /daymark/ {
        try_files /daymark/index.html =404;
        expires -1;
    }

    location ~ ^/daymark/(.+)$ {
        return 308 https://daymark.whago.net/$1;
    }

    location = /siteboard {
        return 302 /siteboard/;
    }

    location = /siteboard/ {
        try_files /siteboard/index.html =404;
        expires -1;
    }

    location ~ ^/siteboard/(.+)$ {
        return 308 https://siteboard.whago.net/$1;
    }

    location = /repolens {
        return 308 https://repolens.whago.net/;
    }

    location ~ ^/repolens/(.*)$ {
        return 308 https://repolens.whago.net/$1;
    }

    location ^~ /_next/static/ {
        try_files $uri =404;
        expires 1y;
    }

    location = /index.html {
        try_files $uri =404;
        expires -1;
    }

    location = /release.json {
        try_files $uri =404;
        expires -1;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
        expires -1;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    ssl_certificate /etc/letsencrypt/live/whago.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whago.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen [::]:443 ssl;
    listen 443 ssl;
    server_name www.whago.net;

    root /srv/whago-home/current/out;

    location = /daymark {
        return 302 /daymark/;
    }

    location = /daymark/ {
        try_files /daymark/index.html =404;
        expires -1;
    }

    location = /siteboard {
        return 302 /siteboard/;
    }

    location = /siteboard/ {
        try_files /siteboard/index.html =404;
        expires -1;
    }

    location = /data-move.css {
        try_files $uri =404;
        expires -1;
    }

    location = /data-move.js {
        try_files $uri =404;
        expires -1;
    }

    location / {
        return 301 https://whago.net$request_uri;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    ssl_certificate /etc/letsencrypt/live/whago.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whago.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen [::]:443 ssl;
    listen 443 ssl;
    server_name daymark.whago.net;

    root /srv/whago-products/daymark/current/dist;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    location = /healthz {
        default_type text/plain;
        expires -1;
        return 200 "daymark ok\n";
    }

    location = /index.html {
        try_files $uri =404;
        expires -1;
    }

    location = /service-worker.js {
        try_files $uri =404;
        expires -1;
    }

    location = /release.json {
        try_files $uri =404;
        expires -1;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location ~* \.(?:css|js|mjs|woff2?)$ {
        try_files $uri =404;
        expires 1y;
    }

    location ~* \.(?:png|jpe?g|gif|svg|webp|ico)$ {
        try_files $uri =404;
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; manifest-src 'self'; connect-src 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    ssl_certificate /etc/letsencrypt/live/whago.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whago.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

