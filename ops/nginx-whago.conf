server {
    server_name whago.net www.whago.net _;

    server_tokens off;
    client_max_body_size 4m;

    location = /healthz {
        proxy_pass http://127.0.0.1:3100/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
    }

    location = /daymark {
        return 301 /daymark/;
    }

    location = /repolens {
        return 301 /repolens/;
    }

    location = /siteboard {
        return 301 /siteboard/;
    }

    location = /daymark/ {
        root /srv/whago-tools/current;
        try_files /daymark/index.html =404;
        expires -1;
    }

    location = /siteboard/ {
        root /srv/whago-tools/current;
        try_files /siteboard/index.html =404;
        expires -1;
    }

    location = /repolens/ {
        root /srv/whago-tools/current;
        try_files /repolens/index.html =404;
        expires -1;
    }

    location ~ ^/(daymark|siteboard)/assets/ {
        root /srv/whago-tools/current;
        try_files $uri =404;
        expires 1y;
    }

    location ~ ^/(daymark|siteboard)/(service-worker\.js|sw\.js|manifest\.webmanifest)$ {
        root /srv/whago-tools/current;
        try_files $uri =404;
        expires -1;
    }

    location /daymark/ {
        root /srv/whago-tools/current;
        try_files $uri =404;
        expires 7d;
    }

    location /siteboard/ {
        root /srv/whago-tools/current;
        try_files $uri =404;
        expires 7d;
    }

    location /repolens/ {
        root /srv/whago-tools/current;
        try_files $uri =404;
        expires -1;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/whago.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whago.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name whago.net www.whago.net _;
    return 301 https://$host$request_uri;
}
